version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthcare_queue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: hq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      NODE_ENV: production

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: hq-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - web/.env
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: hq-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - web

volumes:
  postgres_data:
  redis_data:
  backend_logs:
